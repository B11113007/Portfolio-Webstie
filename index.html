<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z.Y.LEE — Architecture Portfolio</title>
  <meta name="description" content="Architecture portfolio of Z.Y.LEE — tectonic clarity, spatial thresholds, and environmental adaptability.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body data-page="home">

  <!-- SITE HEADER -->
  <header class="site-header">
    <a href="index.html" class="brand-logo" aria-label="Z.Y.LEE — home">Z.Y.LEE</a>
    <div class="nav-container">
      <nav aria-label="Primary navigation">
        <ul class="nav-links">
          <li><a href="work.html"  id="nav-work">WORK</a></li>
          <li><a href="about.html" id="nav-about">ABOUT</a></li>
        </ul>
      </nav>
      <button class="lang-btn" id="lang-toggle-btn" aria-label="Toggle language between English and Chinese">EN / 中文</button>
    </div>
  </header>

  <main>

    <!-- 01. FEATURED CAROUSEL -->
    <section id="home" aria-label="Featured portfolio">
      <div class="carousel-stage">
        <div class="carousel-viewport" id="carousel-viewport" aria-label="Featured projects carousel" aria-roledescription="carousel">
          <!-- Cards rendered via script.js from data/projects.json -->
        </div>

        <!-- Touch devices: info shown below the image instead of hover overlay -->
        <div class="carousel-caption" id="carousel-caption" aria-live="polite"></div>

        <div class="carousel-controls">
          <button class="carousel-btn" id="prev-btn" aria-label="Previous project">
            <span class="arrow" aria-hidden="true">←</span><span id="label-prev">PREV</span>
          </button>
          <button class="carousel-btn" id="next-btn" aria-label="Next project">
            <span id="label-next">NEXT</span><span class="arrow" aria-hidden="true">→</span>
          </button>
        </div>
      </div>
    </section>

    <!-- 02. WORK PREVIEW -->
    <section id="work" aria-labelledby="work-title">
      <span class="section-label" id="work-label">INDEX / SELECTED PROJECTS</span>
      <h2 class="section-title" id="work-title">Selected Works</h2>
      <div class="gallery-grid" id="gallery-grid" aria-label="Project gallery">
        <!-- First N projects rendered via script.js (N = homeWorkCount in data/site.json) -->
      </div>
      <div class="section-more">
        <a href="work.html" class="link-arrow"><span id="label-view-all-work">VIEW ALL</span><span class="arrow" aria-hidden="true">→</span></a>
      </div>
    </section>

    <!-- 03. PROFILE PREVIEW -->
    <section id="profile" aria-labelledby="profile-title">
      <span class="section-label" id="profile-label">BIOGRAPHY &amp; CREDENTIALS</span>
      <h2 class="section-title" id="profile-title">Profile</h2>
      <div class="profile-preview">
        <p class="profile-bio-main" id="profile-bio-main"></p>
        <p class="profile-sub-text" id="profile-bio-sub"></p>
      </div>
      <div class="section-more">
        <a href="about.html" class="link-arrow"><span id="label-view-profile">VIEW PROFILE</span><span class="arrow" aria-hidden="true">→</span></a>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div>© 2026 Z.Y.LEE. ALL RIGHTS RESERVED.</div>
    <div><a href="about.html" style="color:inherit;text-decoration:none;">ABOUT &amp; CV</a></div>
  </footer>

  <script src="script.js?v=5"></script>
</body>
</html>
