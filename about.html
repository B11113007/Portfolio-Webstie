<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About — Z.Y.LEE</title>
  <meta name="description" content="Biography, credentials, and awards of Z.Y.LEE.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body data-page="about">

  <!-- SITE HEADER -->
  <header class="site-header">
    <a href="index.html" class="brand-logo" aria-label="Z.Y.LEE — home">Z.Y.LEE</a>
    <div class="nav-container">
      <nav aria-label="Primary navigation">
        <ul class="nav-links">
          <li><a href="work.html"  id="nav-work">WORK</a></li>
          <li><a href="about.html" id="nav-about" class="active" aria-current="page">ABOUT</a></li>
        </ul>
      </nav>
      <button class="lang-btn" id="lang-toggle-btn" aria-label="Toggle language between English and Chinese">EN / 中文</button>
    </div>
  </header>

  <main>

    <!-- PROFILE / BIOGRAPHY / AWARDS -->
    <section id="profile" aria-labelledby="profile-title">
      <h1 class="section-title" id="profile-title">Profile</h1>

      <div class="about-layout" id="about-layout">

        <!-- Optional photo column (shown automatically when "photo" is set in data/about.json) -->
        <div class="about-photo-col" id="about-photo-col" hidden>
          <img id="about-photo" src="" alt="Profile portrait">
        </div>

        <!-- Bio + Credentials + Awards column -->
        <div class="about-content-col">
          <div class="about-bio-block">
            <p class="profile-bio-main" id="profile-bio-main"></p>
            <p class="profile-sub-text" id="profile-bio-sub"></p>
            <a href="#" class="cv-download-btn" id="cv-btn" aria-label="Download full CV as PDF">
              DOWNLOAD FULL CV (PDF) ↓
            </a>
          </div>

          <div class="profile-credentials" aria-label="Education, experience, and awards">

            <div class="cred-group">
              <h2 id="head-edu">EDUCATION</h2>
              <ul class="cred-list" id="edu-list"></ul>
            </div>

            <div class="cred-group">
              <h2 id="head-exp">SELECTED EXPERIENCE</h2>
              <ul class="cred-list" id="exp-list"></ul>
            </div>

            <div class="cred-group">
              <h2 id="head-awards">AWARDS &amp; ACCOMPLISHMENTS</h2>
              <ul class="cred-list" id="awards-list"></ul>
            </div>

          </div>
        </div>

      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div>© 2026 Z.Y.LEE. ALL RIGHTS RESERVED.</div>
    <div><a href="index.html" style="color:inherit;text-decoration:none;">← BACK TO HOME</a></div>
  </footer>

  <script src="script.js?v=3"></script>
</body>
</html>
